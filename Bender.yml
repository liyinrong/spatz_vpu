package:
  name: spatz
  authors:
    - "Matheus Cavalcante <matheusd@iis.ee.ethz.ch>"
    - "Mattia Sinigaglia <mattia.sinigaglia5@unibo.it>"

dependencies:
  common_cells:       { git: "https://github.com/pulp-platform/common_cells.git",       version: 1.28.0      }
  FPnew:              { git: "https://github.com/pulp-platform/cvfpu.git",              rev:     pulp-v0.3.0 }
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.11      }

export_include_dirs:
  - hw/ip/reqrsp_interface/include

sources:
  # rvv_pkg and spatz_pkg carry the vector type and geometry definitions. An
  # integration whose core complex is one file for both the scalar and the vector
  # build imports them unconditionally -- a generate branch does not stop vlog from
  # having to resolve the package -- so they cannot sit behind `target: spatz`.
  - files:
    - hw/src/rvv_pkg.sv
    - hw/src/generated/spatz_pkg.sv

  - target: spatz
    files:
    # Level 0
    - hw/src/reorder_buffer.sv
    # Level 1
    - hw/src/spatz_serdiv.sv
    # Level 2
    - hw/src/spatz_decoder.sv
    - hw/src/spatz_simd_lane.sv
    - hw/src/vregfile.sv
    # Level 3
    - hw/src/spatz_fpu_sequencer.sv
    - hw/src/spatz_ipu.sv
    - hw/src/spatz_vfu.sv
    - hw/src/spatz_vlsu.sv
    - hw/src/spatz_vrf.sv
    - hw/src/spatz_vsldu.sv
    # Level 4
    - hw/src/spatz_controller.sv
    # Level 5
    - hw/src/spatz.sv

  # hw/ip/spatz_cc/src/spatz_mempool_cc.sv is deliberately NOT compiled: TeraNoC
  # inlines the MemPool core complex into its own mempool_cc, and this file reads
  # constants that exist only in the integration it belongs to. The source is kept
  # because that integration is what the burst work was developed against.
